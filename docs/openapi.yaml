openapi: 3.0.3
info:
  title: sub2api Admin API
  version: 0.1.127
  description: |
    sub2api 管理端 API。本文档覆盖源码中 `RegisterAdminRoutes` 和 `RegisterPaymentRoutes`
    挂载的所有 `adminAuth` 管理接口。

    认证方式：在 Swagger UI 右上角 Authorize 中填写管理员 Key，实际请求会发送
    `x-api-key: <admin-api-key>`。

    管理员 Key 是全局高权限密钥，没有细粒度 scope。账号导出、备份下载、系统重启、
    系统更新、支付退款、用量清理等接口有强副作用或敏感数据返回。
servers:
  - url: http://127.0.0.1:8080
    description: Local sub2api deployment
security:
  - AdminApiKey: []
tags:
  - name: Dashboard
    description: 管理仪表盘、统计与聚合
  - name: Users
    description: 用户、用户 API Key、用户余额、用户属性值
  - name: Groups
    description: 分组、倍率、RPM override、容量和用量
  - name: Accounts
    description: 上游账号、凭据、模型、批量操作、Claude OAuth
  - name: OAuth
    description: OpenAI、Gemini、Antigravity OAuth 管理
  - name: Proxies
    description: 代理管理和代理导入导出
  - name: Announcements
    description: 公告管理
  - name: RedeemCodes
    description: 卡密/兑换码管理
  - name: PromoCodes
    description: 优惠码管理
  - name: Settings
    description: 系统设置、管理员 Key、网关运行策略
  - name: DataManagement
    description: 数据管理 agent、source profile、S3 profile、备份任务
  - name: Backups
    description: 数据库备份、下载、恢复
  - name: Ops
    description: 运维监控、告警、错误日志、请求明细、系统日志
  - name: System
    description: 版本、更新、回滚、重启
  - name: Subscriptions
    description: 用户订阅分配、延期、撤销、quota
  - name: Usage
    description: 用量记录、统计、清理任务
  - name: UserAttributes
    description: 用户属性定义
  - name: ErrorPassthrough
    description: 错误透传规则
  - name: TLSFingerprintProfiles
    description: TLS 指纹模板
  - name: APIKeys
    description: 管理用户 API Key 的分组和限速用量
  - name: ScheduledTests
    description: 账号定时测试计划
  - name: Channels
    description: 渠道管理
  - name: ChannelMonitors
    description: 渠道监控和模板
  - name: RiskControl
    description: 风控配置、日志、解封、flagged hash
  - name: Affiliates
    description: 邀请返利管理
  - name: AdminPayment
    description: 支付配置、订单、套餐、provider 管理
paths:
  # Reusable YAML anchors. This synthetic extension key is ignored by OpenAPI tools,
  # but lets the path operations below reuse a full OpenAPI Responses Object.
  x-response-anchors:
    standard: &StandardResponses
      '200':
        description: 成功。sub2api 通常返回统一响应包裹，data 的具体结构随 handler/service 而定。
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiResponse'}
      '400': {$ref: '#/components/responses/BadRequest'}
      '401': {$ref: '#/components/responses/Unauthorized'}
      '403': {$ref: '#/components/responses/Forbidden'}
      '500': {$ref: '#/components/responses/InternalError'}
    acceptedOrSuccess: &AcceptedOrSuccessResponses
      '200':
        description: 成功
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiResponse'}
      '202':
        description: 已接受，后台任务已启动
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiResponse'}
      '400': {$ref: '#/components/responses/BadRequest'}
      '401': {$ref: '#/components/responses/Unauthorized'}
      '403': {$ref: '#/components/responses/Forbidden'}
      '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/admin/dashboard/snapshot-v2:
    get: {tags: [Dashboard], summary: 获取仪表盘快照 v2, operationId: getAdminDashboardSnapshotV2, responses: *StandardResponses}
  /api/v1/admin/dashboard/stats:
    get: {tags: [Dashboard], summary: 获取仪表盘总览统计, operationId: getAdminDashboardStats, responses: *StandardResponses}
  /api/v1/admin/dashboard/realtime:
    get: {tags: [Dashboard], summary: 获取实时指标, operationId: getAdminDashboardRealtime, responses: *StandardResponses}
  /api/v1/admin/dashboard/trend:
    get:
      tags: [Dashboard]
      summary: 获取用量趋势
      operationId: getAdminDashboardTrend
      parameters: [{$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}, {$ref: '#/components/parameters/RequestType'}, {$ref: '#/components/parameters/Stream'}, {$ref: '#/components/parameters/BillingType'}]
      responses: *StandardResponses
  /api/v1/admin/dashboard/models:
    get: {tags: [Dashboard], summary: 获取模型统计, operationId: getAdminDashboardModels, parameters: [{$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/dashboard/groups:
    get: {tags: [Dashboard], summary: 获取分组统计, operationId: getAdminDashboardGroups, parameters: [{$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/dashboard/api-keys-trend:
    get: {tags: [Dashboard], summary: 获取 API Key 用量趋势, operationId: getAdminDashboardApiKeysTrend, parameters: [{$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/dashboard/users-trend:
    get: {tags: [Dashboard], summary: 获取用户用量趋势, operationId: getAdminDashboardUsersTrend, parameters: [{$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/dashboard/users-ranking:
    get: {tags: [Dashboard], summary: 获取用户消费排行, operationId: getAdminDashboardUsersRanking, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/dashboard/users-usage:
    post: {tags: [Dashboard], summary: 批量查询用户用量, operationId: postAdminDashboardUsersUsage, requestBody: {$ref: '#/components/requestBodies/IdListBody'}, responses: *StandardResponses}
  /api/v1/admin/dashboard/api-keys-usage:
    post: {tags: [Dashboard], summary: 批量查询 API Key 用量, operationId: postAdminDashboardApiKeysUsage, requestBody: {$ref: '#/components/requestBodies/IdListBody'}, responses: *StandardResponses}
  /api/v1/admin/dashboard/user-breakdown:
    get: {tags: [Dashboard], summary: 获取用户分解统计, operationId: getAdminDashboardUserBreakdown, parameters: [{$ref: '#/components/parameters/UserIdQuery'}, {$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/dashboard/aggregation/backfill:
    post: {tags: [Dashboard], summary: 回填聚合数据, operationId: postAdminDashboardAggregationBackfill, description: 有后台数据写入副作用。建议使用 Idempotency-Key。响应结构随聚合服务实现变化。 request body 可传 backfill 时间范围。 , requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}

  /api/v1/admin/users:
    get: {tags: [Users], summary: 用户列表, operationId: listAdminUsers, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Status'}, {$ref: '#/components/parameters/Role'}], responses: *StandardResponses}
    post:
      tags: [Users]
      summary: 创建用户
      operationId: createAdminUser
      requestBody: {$ref: '#/components/requestBodies/UserCreateBody'}
      responses: *StandardResponses
  /api/v1/admin/users/batch-concurrency:
    post: {tags: [Users], summary: 批量更新用户并发, operationId: postAdminUsersBatchConcurrency, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/users/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Users], summary: 获取用户详情, operationId: getAdminUser, responses: *StandardResponses}
    put: {tags: [Users], summary: 更新用户, operationId: updateAdminUser, requestBody: {$ref: '#/components/requestBodies/UserUpdateBody'}, responses: *StandardResponses}
    delete: {tags: [Users], summary: 删除用户, operationId: deleteAdminUser, responses: *StandardResponses}
  /api/v1/admin/users/{id}/auth-identities:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Users], summary: 手动绑定第三方认证身份, operationId: bindAdminUserAuthIdentity, requestBody: {$ref: '#/components/requestBodies/AuthIdentityBindBody'}, responses: *StandardResponses}
  /api/v1/admin/users/{id}/balance:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Users], summary: 修改用户余额, operationId: updateAdminUserBalance, requestBody: {$ref: '#/components/requestBodies/BalanceUpdateBody'}, responses: *StandardResponses}
  /api/v1/admin/users/{id}/api-keys:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Users], summary: 获取用户 API Key 列表, operationId: getAdminUserApiKeys, responses: *StandardResponses}
  /api/v1/admin/users/{id}/usage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Users], summary: 获取用户用量, operationId: getAdminUserUsage, parameters: [{$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/users/{id}/balance-history:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Users], summary: 获取用户余额历史, operationId: getAdminUserBalanceHistory, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: *StandardResponses}
  /api/v1/admin/users/{id}/replace-group:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Users], summary: 替换用户独占分组, operationId: replaceAdminUserGroup, requestBody: {$ref: '#/components/requestBodies/ReplaceGroupBody'}, responses: *StandardResponses}
  /api/v1/admin/users/{id}/rpm-status:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Users], summary: 获取用户 RPM 状态, operationId: getAdminUserRpmStatus, responses: *StandardResponses}
  /api/v1/admin/users/{id}/attributes:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Users], summary: 获取用户属性值, operationId: getAdminUserAttributes, responses: *StandardResponses}
    put: {tags: [Users], summary: 更新用户属性值, operationId: updateAdminUserAttributes, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/users/{id}/subscriptions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Subscriptions], summary: 获取用户订阅列表, operationId: getAdminUserSubscriptions, responses: *StandardResponses}

  /api/v1/admin/groups:
    get: {tags: [Groups], summary: 分组列表, operationId: listAdminGroups, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Platform'}, {$ref: '#/components/parameters/Status'}], responses: *StandardResponses}
    post: {tags: [Groups], summary: 创建分组, operationId: createAdminGroup, requestBody: {$ref: '#/components/requestBodies/GroupBody'}, responses: *StandardResponses}
  /api/v1/admin/groups/all:
    get: {tags: [Groups], summary: 获取全部分组, operationId: getAllAdminGroups, responses: *StandardResponses}
  /api/v1/admin/groups/usage-summary:
    get: {tags: [Groups], summary: 分组用量摘要, operationId: getAdminGroupUsageSummary, responses: *StandardResponses}
  /api/v1/admin/groups/capacity-summary:
    get: {tags: [Groups], summary: 分组容量摘要, operationId: getAdminGroupCapacitySummary, responses: *StandardResponses}
  /api/v1/admin/groups/sort-order:
    put: {tags: [Groups], summary: 更新分组排序, operationId: updateAdminGroupSortOrder, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/groups/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Groups], summary: 获取分组详情, operationId: getAdminGroup, responses: *StandardResponses}
    put: {tags: [Groups], summary: 更新分组, operationId: updateAdminGroup, requestBody: {$ref: '#/components/requestBodies/GroupBody'}, responses: *StandardResponses}
    delete: {tags: [Groups], summary: 删除分组, operationId: deleteAdminGroup, responses: *StandardResponses}
  /api/v1/admin/groups/{id}/stats:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Groups], summary: 获取分组统计, operationId: getAdminGroupStats, responses: *StandardResponses}
  /api/v1/admin/groups/{id}/rate-multipliers:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Groups], summary: 获取分组模型倍率, operationId: getAdminGroupRateMultipliers, responses: *StandardResponses}
    put: {tags: [Groups], summary: 批量设置分组模型倍率, operationId: setAdminGroupRateMultipliers, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
    delete: {tags: [Groups], summary: 清空分组模型倍率, operationId: clearAdminGroupRateMultipliers, responses: *StandardResponses}
  /api/v1/admin/groups/{id}/rpm-overrides:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put: {tags: [Groups], summary: 批量设置分组 RPM override, operationId: setAdminGroupRpmOverrides, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
    delete: {tags: [Groups], summary: 清空分组 RPM override, operationId: clearAdminGroupRpmOverrides, responses: *StandardResponses}
  /api/v1/admin/groups/{id}/api-keys:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Groups], summary: 获取分组 API Key, operationId: getAdminGroupApiKeys, responses: *StandardResponses}
  /api/v1/admin/groups/{id}/subscriptions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Subscriptions], summary: 获取分组订阅列表, operationId: getAdminGroupSubscriptions, responses: *StandardResponses}

  /api/v1/admin/accounts:
    get: {tags: [Accounts], summary: 上游账号列表, operationId: listAdminAccounts, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Platform'}, {$ref: '#/components/parameters/Status'}], responses: *StandardResponses}
    post: {tags: [Accounts], summary: 创建上游账号, operationId: createAdminAccount, requestBody: {$ref: '#/components/requestBodies/AccountBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/data:
    get:
      tags: [Accounts]
      summary: 导出账号和代理数据
      operationId: exportAdminAccountsData
      description: 高风险接口。源码明确对管理员备份导出返回账号 credentials 原文；include_proxies=true 时返回代理密码。
      parameters:
        - {name: ids, in: query, required: false, schema: {type: string}, description: 逗号分隔账号 ID；为空导出全部匹配账号}
        - {name: include_proxies, in: query, required: false, schema: {type: boolean, default: false}}
      responses: *StandardResponses
    post: {tags: [Accounts], summary: 导入账号和代理数据, operationId: importAdminAccountsData, requestBody: {$ref: '#/components/requestBodies/DataImportBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/batch:
    post: {tags: [Accounts], summary: 批量创建账号, operationId: batchCreateAdminAccounts, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/bulk-update:
    post: {tags: [Accounts], summary: 批量更新账号, operationId: bulkUpdateAdminAccounts, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/batch-update-credentials:
    post: {tags: [Accounts], summary: 批量更新账号凭据, operationId: batchUpdateAdminAccountCredentials, description: 高风险接口，会写入上游账号 credentials。建议使用 Idempotency-Key。 , requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/batch-refresh-tier:
    post: {tags: [Accounts], summary: 批量刷新账号 tier, operationId: batchRefreshAdminAccountTier, requestBody: {$ref: '#/components/requestBodies/IdListBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/batch-clear-error:
    post: {tags: [Accounts], summary: 批量清除账号错误, operationId: batchClearAdminAccountError, requestBody: {$ref: '#/components/requestBodies/IdListBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/batch-refresh:
    post: {tags: [Accounts], summary: 批量刷新账号 token/状态, operationId: batchRefreshAdminAccounts, requestBody: {$ref: '#/components/requestBodies/IdListBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/check-mixed-channel:
    post: {tags: [Accounts], summary: 检查 mixed channel, operationId: checkAdminAccountMixedChannel, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/import/codex-session:
    post: {tags: [Accounts], summary: 导入 Codex session, operationId: importAdminCodexSession, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/sync/crs:
    post: {tags: [Accounts], summary: 从 CRS 同步账号, operationId: syncAdminAccountsFromCrs, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/sync/crs/preview:
    post: {tags: [Accounts], summary: 预览 CRS 同步, operationId: previewAdminAccountsFromCrs, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/today-stats/batch:
    post: {tags: [Accounts], summary: 批量获取账号今日统计, operationId: batchGetAdminAccountTodayStats, requestBody: {$ref: '#/components/requestBodies/IdListBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/antigravity/default-model-mapping:
    get: {tags: [Accounts], summary: 获取 Antigravity 默认模型映射, operationId: getAdminAntigravityDefaultModelMapping, responses: *StandardResponses}
  /api/v1/admin/accounts/generate-auth-url:
    post: {tags: [Accounts], summary: 生成 Claude OAuth 授权 URL, operationId: generateClaudeAuthUrl, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/generate-setup-token-url:
    post: {tags: [Accounts], summary: 生成 Claude setup token URL, operationId: generateClaudeSetupTokenUrl, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/exchange-code:
    post: {tags: [Accounts], summary: 交换 Claude OAuth code, operationId: exchangeClaudeCode, requestBody: {$ref: '#/components/requestBodies/OAuthCodeBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/exchange-setup-token-code:
    post: {tags: [Accounts], summary: 交换 Claude setup token code, operationId: exchangeClaudeSetupTokenCode, requestBody: {$ref: '#/components/requestBodies/OAuthCodeBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/cookie-auth:
    post: {tags: [Accounts], summary: Claude cookie auth 导入, operationId: claudeCookieAuth, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/setup-token-cookie-auth:
    post: {tags: [Accounts], summary: Claude setup token cookie auth 导入, operationId: claudeSetupTokenCookieAuth, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Accounts], summary: 获取账号详情, operationId: getAdminAccount, responses: *StandardResponses}
    put: {tags: [Accounts], summary: 更新账号, operationId: updateAdminAccount, requestBody: {$ref: '#/components/requestBodies/AccountBody'}, responses: *StandardResponses}
    delete: {tags: [Accounts], summary: 删除账号, operationId: deleteAdminAccount, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/test:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Accounts], summary: 测试账号, operationId: testAdminAccount, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/recover-state:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Accounts], summary: 恢复账号状态, operationId: recoverAdminAccountState, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/refresh:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Accounts], summary: 刷新账号 token/状态, operationId: refreshAdminAccount, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/set-privacy:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Accounts], summary: 设置账号隐私, operationId: setAdminAccountPrivacy, requestBody: {$ref: '#/components/requestBodies/FreeFormBody'}, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/refresh-tier:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Accounts], summary: 刷新账号 tier, operationId: refreshAdminAccountTier, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/stats:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Accounts], summary: 获取账号统计, operationId: getAdminAccountStats, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/clear-error:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Accounts], summary: 清除账号错误, operationId: clearAdminAccountError, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/usage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Accounts], summary: 获取账号用量, operationId: getAdminAccountUsage, parameters: [{$ref: '#/components/parameters/StartTime'}, {$ref: '#/components/parameters/EndTime'}], responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/today-stats:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [Accounts], summary: 获取账号今日统计, operationId: getAdminAccountTodayStats, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/clear-rate-limit:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [Accounts], summary: 清除账号 rate limit, operationId: clearAdminAccountRateLimit, responses: *StandardResponses}
  /api/v1/admin/accounts/{id}/reset-quota:
    parameters: [{$ref: '#/components/parameters/Id'}]
