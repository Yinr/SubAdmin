components:
  securitySchemes:
    AdminApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 管理员 API Key，格式通常为 admin- 后接 64 位十六进制字符。
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: integer, format: int64}, description: 数字 ID}
    IdString: {name: id, in: path, required: true, schema: {type: string}, description: 字符串或数字 ID}
    UserIdPath: {name: user_id, in: path, required: true, schema: {type: integer, format: int64}}
    JobId: {name: job_id, in: path, required: true, schema: {type: string}}
    ProfileId: {name: profile_id, in: path, required: true, schema: {type: string}}
    SourceType: {name: source_type, in: path, required: true, schema: {type: string}}
    Idx: {name: idx, in: path, required: true, schema: {type: integer}}
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 20}}
    Search: {name: search, in: query, required: false, schema: {type: string}}
    Status: {name: status, in: query, required: false, schema: {type: string}}
    Role: {name: role, in: query, required: false, schema: {type: string, enum: [admin, user]}}
    Platform: {name: platform, in: query, required: false, schema: {type: string, example: anthropic}}
    StartTime: {name: start_time, in: query, required: false, schema: {type: string}, description: RFC3339 或服务端支持的时间字符串}
    EndTime: {name: end_time, in: query, required: false, schema: {type: string}, description: RFC3339 或服务端支持的时间字符串}
    UserIdQuery: {name: user_id, in: query, required: false, schema: {type: integer, format: int64}}
    ApiKeyIdQuery: {name: api_key_id, in: query, required: false, schema: {type: integer, format: int64}}
    AccountIdQuery: {name: account_id, in: query, required: false, schema: {type: integer, format: int64}}
    GroupIdQuery: {name: group_id, in: query, required: false, schema: {type: integer, format: int64}}
    RequestType: {name: request_type, in: query, required: false, schema: {type: integer}, description: 请求类型过滤，具体枚举以服务端 usagestats 定义为准}
    Stream: {name: stream, in: query, required: false, schema: {type: boolean}}
    BillingType: {name: billing_type, in: query, required: false, schema: {type: integer}, description: 计费类型过滤，具体枚举以服务端定义为准}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string}, description: 写操作幂等键}
  requestBodies:
    FreeFormBody:
      required: false
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FreeFormObject'}
    IdListBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              ids:
                type: array
                items: {type: integer, format: int64}
              user_ids:
                type: array
                items: {type: integer, format: int64}
              api_key_ids:
                type: array
                items: {type: integer, format: int64}
          examples:
            ids: {value: {ids: [1, 2, 3]}}
    UserCreateBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UserCreateRequest'}
    UserUpdateBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UserUpdateRequest'}
    BalanceUpdateBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BalanceUpdateRequest'}
    ReplaceGroupBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReplaceGroupRequest'}
    AuthIdentityBindBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthIdentityBindRequest'}
    GroupBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GroupRequest'}
    AccountBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccountRequest'}
    ProxyBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProxyRequest'}
    OAuthCodeBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthCodeRequest'}
    SettingsBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SystemSettingsPatch'}
    S3ConfigBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/S3Config'}
    RestoreBackupBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: {type: string, format: password, description: 当前管理员密码}
    DataImportBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DataImportRequest'}
    SubscriptionAssignBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SubscriptionAssignRequest'}
    AdminApiKeyUpdateBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminApiKeyUpdateRequest'}
    ChannelBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ChannelRequest'}
  responses:
    BadRequest: {description: 请求参数错误, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: 未认证或管理员 Key 无效, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: 无权限, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InternalError: {description: 服务端错误, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ApiResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        message: {type: string}
        data: {type: object, description: 业务数据；不同接口结构不同, nullable: true, additionalProperties: true}
        error: {type: string, nullable: true}
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success: {type: boolean, example: false}
        error: {type: string, example: INVALID_ADMIN_KEY}
        message: {type: string, example: Invalid admin api key}
        code: {type: string}
      additionalProperties: true
    FreeFormObject:
      type: object
      description: 复杂 DTO 以源码 handler/service 为准；本文档保留自由对象以便 Swagger UI 实际试用。
      additionalProperties: true
    UserCreateRequest:
      type: object
      required: [username, email, password]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password}
        role: {type: string, enum: [admin, user]}
        status: {type: string}
        balance: {type: number}
        concurrency: {type: integer}
        rpm_limit: {type: integer, nullable: true}
        group_ids: {type: array, items: {type: integer, format: int64}}
      additionalProperties: true
    UserUpdateRequest:
      type: object
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password}
        role: {type: string, enum: [admin, user]}
        status: {type: string}
        balance: {type: number}
        concurrency: {type: integer}
        rpm_limit: {type: integer, nullable: true}
        group_ids: {type: array, items: {type: integer, format: int64}}
      additionalProperties: true
    BalanceUpdateRequest:
      type: object
      required: [amount]
      properties:
        amount: {type: number, description: 调整金额，具体是 set/add 取决于服务端请求字段}
        type: {type: string, description: 操作类型，如 set/add/subtract，具体枚举以源码为准}
        reason: {type: string}
      additionalProperties: true
    ReplaceGroupRequest:
      type: object
      properties:
        group_id: {type: integer, format: int64, nullable: true}
      additionalProperties: true
    AuthIdentityBindRequest:
      type: object
      required: [provider_type, provider_key]
      properties:
        provider_type: {type: string, example: dingtalk}
        provider_key: {type: string}
        metadata: {type: object, additionalProperties: true}
        channel: {type: object, additionalProperties: true}
      additionalProperties: true
    GroupRequest:
      type: object
      properties:
        name: {type: string}
        platform: {type: string, example: anthropic}
        status: {type: string}
        priority: {type: integer}
        rate_multiplier: {type: number}
        rpm_limit: {type: integer, nullable: true}
        is_exclusive: {type: boolean}
        supported_model_scopes: {type: array, items: {type: string}}
      additionalProperties: true
    AccountRequest:
      type: object
      properties:
        name: {type: string}
        platform: {type: string, example: anthropic}
        type: {type: string, example: oauth}
        credentials: {type: object, additionalProperties: true, description: 上游账号凭据，高敏感}
        extra: {type: object, additionalProperties: true}
        proxy_id: {type: integer, format: int64, nullable: true}
        status: {type: string}
        schedulable: {type: boolean}
        concurrency: {type: integer}
        priority: {type: integer}
        group_ids: {type: array, items: {type: integer, format: int64}}
      additionalProperties: true
    ProxyRequest:
      type: object
      properties:
        name: {type: string}
        protocol: {type: string, example: http}
        host: {type: string}
        port: {type: integer}
        username: {type: string}
        password: {type: string, format: password}
        status: {type: string}
      additionalProperties: true
    OAuthCodeRequest:
      type: object
      properties:
        code: {type: string}
        state: {type: string}
        redirect_uri: {type: string}
        code_verifier: {type: string}
      additionalProperties: true
    SystemSettingsPatch:
      type: object
      description: 全局系统设置。字段很多，详见 `backend/internal/handler/admin/setting_handler.go` 的 `UpdateSettingsRequest`。
      properties:
        registration_enabled: {type: boolean}
        email_verify_enabled: {type: boolean}
        password_reset_enabled: {type: boolean}
        frontend_url: {type: string}
        smtp_host: {type: string}
        smtp_port: {type: integer}
        smtp_username: {type: string}
        smtp_password: {type: string, format: password}
        turnstile_enabled: {type: boolean}
        turnstile_site_key: {type: string}
        turnstile_secret_key: {type: string, format: password}
        oidc_connect_enabled: {type: boolean}
        oidc_connect_client_id: {type: string}
        oidc_connect_client_secret: {type: string, format: password}
        github_oauth_enabled: {type: boolean}
        google_oauth_enabled: {type: boolean}
        default_balance: {type: number}
        default_concurrency: {type: integer}
        default_user_rpm_limit: {type: integer}
        risk_control_enabled: {type: boolean}
        enable_model_fallback: {type: boolean}
        enable_identity_patch: {type: boolean}
      additionalProperties: true
    S3Config:
      type: object
      properties:
        endpoint: {type: string}
        region: {type: string}
        bucket: {type: string}
        access_key_id: {type: string}
        secret_access_key: {type: string, format: password}
        prefix: {type: string}
      additionalProperties: true
    DataImportRequest:
      type: object
      properties:
        skip_default_group_bind: {type: boolean, default: true}
        data:
          type: object
          properties:
            type: {type: string, example: sub2api-data}
            version: {type: integer, example: 1}
            proxies: {type: array, items: {$ref: '#/components/schemas/ProxyRequest'}}
            accounts: {type: array, items: {$ref: '#/components/schemas/AccountRequest'}}
      additionalProperties: true
    SubscriptionAssignRequest:
      type: object
      properties:
        user_id: {type: integer, format: int64}
        group_id: {type: integer, format: int64}
        validity_days: {type: integer}
        quota: {type: number}
      additionalProperties: true
    AdminApiKeyUpdateRequest:
      type: object
      properties:
        group_id: {type: integer, format: int64, nullable: true, description: 目标分组；null 可解绑}
        reset_rate_limit_usage: {type: boolean, description: true 时重置 5h/1d/7d 限速用量窗口}
      additionalProperties: false
    ChannelRequest:
      type: object
      properties:
        name: {type: string}
        platform: {type: string}
        type: {type: string}
        base_url: {type: string}
        api_key: {type: string, format: password}
        status: {type: string}
        models: {type: array, items: {type: string}}
      additionalProperties: true
